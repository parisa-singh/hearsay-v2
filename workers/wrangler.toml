name = "hearsay-v2-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGIN = "https://parisa-singh.github.io"

# Per-IP rate limiting — Cloudflare native binding, no external resource to create.
# 60 requests / 60s per IP. One user search fans out to ~7 parallel platform calls,
# so this comfortably allows ~8 searches/min per IP while capping curl-loop abuse
# (CORS can't stop non-browser clients). period must be 10 or 60; limit is tunable.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 60, period = 60 }

# KV namespace for caching Reddit OAuth tokens
# Create with: npx wrangler kv namespace create "HEARSAY_CACHE"
# Then paste the id below
# [[kv_namespaces]]
# binding = "KV"
# id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

# Secrets — set via: npx wrangler secret put <KEY>
# GOOGLE_API_KEY
# YELP_API_KEY
# REDDIT_CLIENT_ID
# REDDIT_CLIENT_SECRET
# YOUTUBE_API_KEY
# SERPAPI_KEY
